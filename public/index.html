<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公演を探す | QuickTicket</title>
  <link rel="stylesheet" href="/events.css">
  <script src="/events.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">QuickTicket<span>.</span></a>
      <span class="header-note">音楽との出会いを、もっと身近に。</span>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">DISCOVER LIVE MUSIC</p>
      <h1>あなたの街の<br>コンサートを探そう。</h1>
      <p>心に残る演奏との出会いを、QuickTicketで。</p>
    </section>

    <section class="search-panel" aria-label="公演検索">
      <label for="keyword">公演名・キーワード</label>
      <input id="keyword" type="search"
             placeholder="公演名・演奏家名など">

      <div class="filters">
        <div>
          <label for="region">地域</label>
          <select id="region">
            <option value="">すべての地域</option>
          </select>
        </div>
        <div>
          <label for="genre">ジャンル</label>
          <select id="genre">
            <option value="">すべてのジャンル</option>
          </select>
        </div>
      </div>
    </section>

    <section class="events-section">
      <div class="section-heading">
        <h2>公演一覧</h2>
        <span id="result-count"></span>
      </div>

      <p id="message" role="status">公演情報を読み込み中...</p>
      <div id="events-list" class="events-grid"></div>
    </section>
  </main>

  <footer>© QuickTicket</footer>
</body>
</html>
EOF
